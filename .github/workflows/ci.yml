name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Compact CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Compact Compiler
        run: |
          $HOME/.local/bin/compact update 0.31.1

      - name: Verify Compact Installation
        run: |
          $HOME/.local/bin/compact --version
          $HOME/.local/bin/compact compile --version

      - name: Install Project Dependencies
        run: npm ci

      - name: Compile Compact Contracts
        run: |
          $HOME/.local/bin/compact compile contracts/medproof.compact contracts/managed/medproof

      - name: Verify Generated Contract Artifacts
        run: |
          test -f contracts/managed/medproof/contract/index.js
          test -f contracts/managed/medproof/contract/index.d.ts
          echo "✅ Managed contract artifacts verified successfully."

      - name: Run Automated Test Suite
        run: npm test

      - name: Setup Node.js for UI
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI Dependencies
        run: |
          cd ui
          npm ci

      - name: Build MedProof Next.js UI
        env:
          NEXT_PUBLIC_MIDNIGHT_NETWORK: preprod
          NEXT_PUBLIC_CONTRACT_ADDRESS: 94499a3a15d5818967c5d8acc562daa1656ca07eb873cdfd4eca50d681def626
          NEXT_PUBLIC_INDEXER_URI: https://indexer.preprod.midnight.network/api/v4/graphql
          NEXT_PUBLIC_INDEXER_WS_URI: wss://indexer.preprod.midnight.network/api/v4/graphql/ws
          NEXT_PUBLIC_PROOF_SERVER_URI: http://127.0.0.1:6300
          NEXT_PUBLIC_NETWORK_ID: undeployed
        run: |
          cd ui
          npm run build
          echo "✅ MedProof Next.js UI built successfully."
